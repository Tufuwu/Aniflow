<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AniFlow · 剧情分镜剪辑</title><link rel="stylesheet" href="/static/css/shot_review.css"></head>
<body><header><a href="/">AniFlow</a><span>剧情分镜剪辑</span><a href="/quality-enhancement">画质增强</a><small>单话工作台 · 9:16</small></header>
<main><div class="intro"><div><p class="eyebrow">STORY → SHOTS → FILM</p><h1>让每个镜头，推动剧情。</h1>
<p>从已审核解说稿开始，检查画面、保留关键剧情，再安排声音与节奏。</p></div>
<form id="project-form"><label for="project">第一话项目</label><div class="row"><input id="project" value="first-chapter" required><button>打开项目</button></div></form></div>
<div id="editor" aria-live="polite"></div></main>
<dialog id="crop-dialog"><form method="dialog"><button class="secondary close" aria-label="关闭编辑">关闭</button></form>
<h2>调整镜头</h2><p>在原图上拖出裁切区域，或输入比例。保存后自动锁定本段镜头组合。</p>
<div class="crop-layout"><canvas id="crop-canvas" aria-label="裁切区域编辑画布"></canvas><div id="crop-controls"></div></div>
<p id="crop-error" role="alert"></p><button id="crop-save">保存并锁定</button></dialog>
<script src="/static/js/voice_review.js"></script><script src="/static/js/image_cleanup.js"></script><script src="/static/js/shot_review.js"></script></body></html>
